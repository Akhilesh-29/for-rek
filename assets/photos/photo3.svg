<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="35%" stop-color="#6441a5"/>
      <stop offset="70%" stop-color="#fe8c00"/>
      <stop offset="100%" stop-color="#f83600"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#sunsetGrad)"/>
  <!-- Sea / Horizon -->
  <rect x="0" y="420" width="600" height="180" fill="#1b0825"/>
  <ellipse cx="300" cy="420" rx="90" ry="15" fill="#f83600" opacity="0.6"/>
  <!-- Sun dipping into horizon -->
  <circle cx="300" cy="400" r="50" fill="#fff5ea"/>
  <!-- Birds flying -->
  <path d="M 180 220 Q 190 210 200 220 Q 210 210 220 220" stroke="#fff" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 230 200 Q 237 192 245 200 Q 252 192 260 200" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <text x="300" y="525" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" fill="#fff5ea" letter-spacing="2">GOLDEN HOUR ESCAPE</text>
  <text x="300" y="550" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fcd5ce" opacity="0.8">Replace with your photo in assets/photos/photo3.jpg</text>
</svg>