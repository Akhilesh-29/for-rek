<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="warmGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19061c"/>
      <stop offset="50%" stop-color="#3d142d"/>
      <stop offset="100%" stop-color="#701c43"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#warmGrad4)"/>
  <!-- Fairy lights hanging -->
  <path d="M 0 120 Q 150 180 300 130 T 600 140" stroke="#fcd5ce" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="100" cy="155" r="7" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="200" cy="165" r="8" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="320" cy="135" r="7" fill="#ffb703" filter="url(#glow)"/>
  <circle cx="430" cy="148" r="9" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="530" cy="142" r="6" fill="#ffd166" filter="url(#glow)"/>
  <!-- Romantic candle in jar -->
  <rect x="250" y="320" width="100" height="130" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#fcd5ce" stroke-width="2"/>
  <rect x="270" y="370" width="60" height="70" rx="5" fill="#f4a261"/>
  <!-- Candle flame -->
  <path d="M 300 360 C 290 340, 295 320, 300 300 C 305 320, 310 340, 300 360 Z" fill="#ffbe0b" filter="url(#glow)"/>
  <text x="300" y="525" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" fill="#fff5ea" letter-spacing="2">CANDLELIT NIGHTS</text>
  <text x="300" y="550" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fcd5ce" opacity="0.8">Replace with your photo in assets/photos/photo4.jpg</text>
</svg>